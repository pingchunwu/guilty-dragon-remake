<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Pilot Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #14121a; --ink: #f3ead7; --muted: #b8ad98; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #2a2433, var(--bg) 60%); color: var(--ink);
         font-family: "Noto Sans TC", "Segoe UI", sans-serif; padding: 28px 16px 56px; min-height: 100vh; }
  h1 { text-align: center; font-weight: 600; letter-spacing: .06em; margin: 0 0 4px; }
  p.sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .r { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto 28px; align-items: start; }
  .r figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
  .r figure > img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; }
  .meta { grid-column: 1 / -1; font-size: 14px; color: var(--ink); text-align: left; border-top: 1px solid #3a3646; padding-top: 8px; }
  .meta small { color: var(--muted); }
  @media (max-width: 640px) { .r { grid-template-columns: 1fr; } }
  /* Card layers: art, frame (ComfyUI), skill badge, number + DRAW, stars. All overlay parts are SVG so they stay crisp at any size. */
  .card { position: relative; aspect-ratio: 1; filter: drop-shadow(0 8px 14px #000a); }
  .card > * { position: absolute; }
  .art { inset: 2.6%; width: 94.8%; height: 94.8%; object-fit: cover; object-position: center 18%; }
  .frame { inset: 0; width: 100%; height: 100%; }
  .skill { right: -2%; top: -2%; width: 23%; height: 23%; }
  .num { right: 11%; bottom: 11%; width: 26%; height: 26%; }
  .stars { left: 30%; bottom: 1.2%; width: 40%; height: 9%; }
  .skill svg, .num svg, .stars svg { width: 100%; height: 100%; display: block; overflow: visible; }

</style>
</head>
<body>
<h1>Art pilot · 12 cards</h1>
<p class="sub">OG (frame cut off) | restyled art (img2img + hires) | composed in the matching frame. Badge glyph and number are approximate; they are only here to judge the composition.</p>
<div id="rows"></div>
<script>
  let uid = 0;
  const id = () => `g${uid++}`;

  // Rating star, after the reference: gold star with a thick white rim and a soft white glow.
  function star(x, s, g) {
    const pts = [...Array(10)].map((_, i) => {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * .45 : s;
      return [x + r * Math.cos(a), s + 2 + r * Math.sin(a)];
    }).join("L");
    return `<path d="M${pts}Z" fill="#fff" stroke="#fff" stroke-width="${s * .5}" stroke-linejoin="round" filter="url(#${g}f)" opacity=".7"/>
      <path d="M${pts}Z" fill="#fff" stroke="#fff" stroke-width="${s * .36}" stroke-linejoin="round"/>
      <path d="M${pts}Z" fill="url(#${g})" stroke="#b27400" stroke-width="${s * .07}" stroke-linejoin="round"/>`;
  }
  const stars = (n) => {
    const g = id();
    return `<svg viewBox="0 0 ${n * 22 + 4} 26"><defs>
      <radialGradient id="${g}" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#ffd23a"/><stop offset="1" stop-color="#e08a00"/></radialGradient>
      <filter id="${g}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
      ${[...Array(n)].map((_, i) => star(13 + i * 22, 10, g)).join("")}</svg>`;
  };

  // Skill badge, after the reference: black diamond inside a yellow double frame, a silver-white glyph.
  // Glyph detail lines are dark grey on the silver fill. Glyphs sit on one 30..70 grid.
  const D = `fill="#3c3c44"`, DS = `stroke="#3c3c44"`;
  const sword = (x) => `<path d="M${x} 25 L${x + 5.5} 32 L${x + 5.5} 55 L${x - 5.5} 55 L${x - 5.5} 32 Z"/>
    <path d="M${x - 13} 54 Q${x - 15} 57 ${x - 12} 60 L${x + 12} 60 Q${x + 15} 57 ${x + 13} 54 Z"/>
    <rect x="${x - 2.8}" y="60" width="5.6" height="9"/><circle cx="${x}" cy="71.5" r="3.8"/>
    <path d="M${x} 31 L${x} 52" ${DS} stroke-width="1.6"/><path d="M${x - 2.8} 63 H${x + 2.8} M${x - 2.8} 66 H${x + 2.8}" ${DS} stroke-width="1.2"/>`;
  const arrow = `<path d="M37 26 L46 37 L41 37 L41 49 L33 49 L33 37 L28 37 Z"/>`;
  const GLYPH = {
    draw: `<rect x="37" y="28" width="26" height="44" rx="4"/><rect x="41" y="32" width="18" height="36" rx="2" fill="none" ${DS} stroke-width="2.4"/>`,
    up: `${sword(57)}${arrow}`,
    down: `${sword(57)}<g transform="translate(0 75) scale(1 -1)">${arrow}</g>`,
    guard: `<path d="M50 27 L69 33 L69 47 C69 60 61 67 50 73 C39 67 31 60 31 47 L31 33 Z"/>
      <path d="M50 32.5 L64 37 L64 47 C64 57 58 62.5 50 67 C42 62.5 36 57 36 47 L36 37 Z" fill="none" ${DS} stroke-width="1.6"/>
      <path d="M50 39 V61 M41 47 H59" ${DS} stroke-width="4" stroke-linecap="round"/>`,
    heal: `<path d="M43 29 H57 V43 H71 V57 H57 V71 H43 V57 H29 V43 H43 Z"/><path d="M46.5 32.5 H53.5 V46.5 H67.5 V53.5 H53.5 V67.5 H46.5 V53.5 H32.5 V46.5 H46.5 Z" fill="none" ${DS} stroke-width="1.5"/>`,
  };
  const dia = (i) => `M50 ${i} L${100 - i} 50 L50 ${100 - i} L${i} 50 Z`;
  function badge(k) {
    const y = id(), w = id();
    return `<svg viewBox="0 0 100 100"><defs>
      <linearGradient id="${y}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff36a"/><stop offset=".5" stop-color="#f2d000"/><stop offset="1" stop-color="#c79a00"/></linearGradient>
      <linearGradient id="${w}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e8e8ee"/><stop offset="1" stop-color="#a9a9b4"/></linearGradient></defs>
      <path d="${dia(3)}" transform="translate(0 2.5)" fill="#000" fill-opacity=".5"/>
      <path d="${dia(3)}" fill="#0c0c0c"/>
      <path d="${dia(5)}" fill="url(#${y})"/>
      <path d="${dia(11.5)}" fill="#0c0c0c"/>
      <path d="${dia(14)}" fill="url(#${y})"/>
      <path d="${dia(16.5)}" fill="#0c0c0c"/>
      <g transform="translate(50 50) scale(.84) translate(-50 -50)" fill="url(#${w})">${GLYPH[k]}</g></svg>`;
  }

  // Number + DRAW, after the reference: heavy italic sans in chrome silver, dark outline, a light streak between them.
  function number(n) {
    const g = id(), f = id();
    const txt = (x, y, size, w, label) => [`fill="#000" fill-opacity=".5" stroke="#000" stroke-opacity=".5" stroke-width="${w}" transform="translate(1 ${size * .05})"`,
      `fill="#16161a" stroke="#16161a" stroke-width="${w}"`, `fill="url(#${g})"`]
      .map((a) => `<text x="${x}" y="${y}" text-anchor="end" font-size="${size}" stroke-linejoin="round" ${a}>${label}</text>`).join("");
    return `<svg viewBox="0 0 100 100" style="font-family:Archivo, 'Arial Black', sans-serif;font-weight:900;font-style:italic"><defs>
      <linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#e4e6ec"/><stop offset=".5" stop-color="#8d909c"/><stop offset=".58" stop-color="#eef0f4"/><stop offset="1" stop-color="#b8bbc6"/></linearGradient>
      <filter id="${f}" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="1.4"/></filter></defs>
      ${txt(94, 70, 80, 8, n)}
      <path d="M-40 76.5 Q30 74.5 102 75.5 Q30 77.5 -40 76.5 Z" fill="#fff" filter="url(#${f})"/>
      <path d="M-30 76.3 Q35 75.2 100 75.6 Q35 76.8 -30 76.3 Z" fill="#fff"/>
      ${txt(98, 97, 21, 5, "DRAW")}</svg>`;
  }


  // id, type, wiki rarity -> frame rarity, name, skill glyph, draw
  const CARDS = [
    [1, "heavy", "N", "N", "寺島良子", "guard", 2], [247, "light", "N", "N", "初心なタビー", "up", 2], [490, "magic", "N", "N", "アルフ", "heal", 2],
    [72, "heavy", "R", "R", "オーヴァン", "guard", 3], [319, "light", "R", "R", "迷いなき揺光", "up", 3], [560, "magic", "R", "R", "アイナ", "up", 3],
    [158, "heavy", "SR", "SR", "剣舞のブラックローズ", "guard", 4], [410, "light", "SR", "SR", "カイト", "guard", 4], [655, "magic", "SR", "SR", "舞戻りし死神", "down", 4],
    [235, "heavy", "SR+", "SSR", "灼紅覚醒のエレミア", "heal", 5], [480, "light", "SR+", "SSR", "海の拳士凰花", "down", 3], [719, "magic", "SR+", "SSR", "魔蒼覚醒のココレ", "heal", 5],
  ];
  const RARITIES = ["N", "R", "SR", "SSR", "UR"];
  const frame = (t, r) => `parts/og-frame-${t}-${r}.png`;
  const card = (id, t, r, skill, n) => `<div class="card" style="width:100%">
      <img class="art" src="art/${id}.png" alt="">
      <img class="frame" src="${frame(t, r)}" alt="">
      <div class="skill">${badge(skill)}</div>
      <div class="num">${number(n)}</div>
      <div class="stars">${stars(RARITIES.indexOf(r) + 1)}</div>
    </div>`;
  fetch("art/meta.json").then((r) => r.json()).catch(() => ({})).then((meta) => {
    document.getElementById("rows").innerHTML = CARDS.map(([id, t, wr, fr, name, skill, n]) => {
      const m = meta[id] || {};
      return `<div class="r">
        <div class="meta">#${id} <b>${name}</b> · ${t} · ${wr} (frame ${fr}) <small>· denoise ${m.denoise ?? "?"} · seed ${m.seed ?? "?"}</small></div>
        <figure><img src="og/${id}.webp" alt="">OG</figure>
        <figure><img src="art/${id}.png" alt="">new art</figure>
        <figure>${card(id, t, fr, skill, n)}in frame</figure>
      </div>`;
    }).join("");
  });
</script>
</body>
</html>
